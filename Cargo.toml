[workspace]
resolver = "2"
members = [
    "crates/audio-modem-core",
    "crates/audio-modem-io",
    "crates/audio-modem-cli",
    "crates/audio-modem-gui",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SEKY443/GUI-stego-flac"

[workspace.dependencies]
audio-modem-core = { path = "crates/audio-modem-core" }
audio-modem-io = { path = "crates/audio-modem-io" }

aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crc32fast = "1"
flacenc = "0.5"
flate2 = "1"
getrandom = "0.3"
raptorq = "2"
rustfft = "6"
rayon = "1.10"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = [
    "flac",
    "wav",
    "pcm",
    "mp3",
    "isomp4",
    "aac",
    "ogg",
    "vorbis",
] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
